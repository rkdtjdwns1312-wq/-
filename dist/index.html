<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="배드민턴 모임 운영진을 위한 복식 대진표 생성기" />
  <title>콕끼리 | 배드민턴 대진표</title>
  <style>
    :root { --ink:#18251f; --muted:#617269; --line:#dce6df; --paper:#f7faf7; --card:#fff; --green:#16794a; --green-dark:#0c5935; --lime:#d9f267; --orange:#ffb36a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial, "Malgun Gothic", sans-serif; font-size:16px; line-height:1.5; }
    header { background:var(--green-dark); color:#fff; padding:26px max(24px, calc((100% - 1120px)/2)); }
    .brand { display:flex; align-items:center; gap:12px; font-size:1.5rem; font-weight:800; letter-spacing:-.04em; }
    .shuttle { width:34px; height:34px; background:var(--lime); color:var(--green-dark); display:grid; place-items:center; border-radius:11px; font-size:20px; }
    header p { margin:5px 0 0 46px; color:#d8eadf; font-size:.95rem; }
    main { max-width:1120px; margin:0 auto; padding:32px 24px 72px; }
    .intro { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:24px; }
    h1 { margin:0; font-size:2rem; letter-spacing:-.05em; } .intro p { margin:6px 0 0; color:var(--muted); }
    .workspace { display:grid; grid-template-columns:390px 1fr; gap:24px; align-items:start; }
    .panel, .results { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 6px 20px rgba(22,65,40,.05); }
    .panel { padding:24px; }
    h2 { margin:0 0 18px; font-size:1.12rem; letter-spacing:-.03em; }
    label { display:block; font-size:.9rem; font-weight:700; margin:18px 0 7px; }
    input, textarea { width:100%; border:1px solid #bfcec4; border-radius:10px; background:#fff; color:var(--ink); font:inherit; padding:11px 12px; }
    input:focus, textarea:focus { outline:3px solid rgba(22,121,74,.18); border-color:var(--green); }
    textarea { min-height:198px; resize:vertical; line-height:1.65; }
    .hint { margin:7px 0 0; color:var(--muted); font-size:.82rem; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .fields label { margin-top:0; }
    button { width:100%; margin-top:24px; background:var(--green); border:0; border-radius:11px; color:#fff; padding:14px; font:inherit; font-weight:800; cursor:pointer; }
    button:hover { background:var(--green-dark); } button:focus-visible { outline:3px solid var(--lime); outline-offset:2px; }
    .secondary { background:#edf5ef; color:var(--green-dark); margin-top:10px; } .secondary:hover { background:#dcece1; }
    .results { min-height:520px; overflow:hidden; } .result-head { padding:22px 24px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:15px; align-items:center; }
    .result-head h2 { margin:0; }.summary { color:var(--muted); font-size:.88rem; white-space:nowrap; }
    .empty { padding:75px 28px; text-align:center; color:var(--muted); }.empty .emoji { font-size:2.5rem; margin-bottom:12px; }
    #schedule { padding:20px 24px 28px; }.round { margin-top:20px; }.round-title { display:flex; align-items:center; gap:8px; font-weight:800; margin-bottom:10px; }.round-title span { background:var(--lime); border-radius:99px; padding:3px 9px; font-size:.8rem; }
    .matches { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }.match { border:1px solid var(--line); border-left:4px solid var(--green); border-radius:10px; padding:12px; background:#fbfdfb; }.court { color:var(--green); font-size:.78rem; font-weight:800; }.players { margin-top:6px; font-weight:700; font-size:.96rem; line-height:1.65; }.vs { color:#9c6a34; font-size:.75rem; font-weight:800; margin:0 4px; }.rest { margin-top:10px; padding:10px 12px; border-radius:9px; background:#fff8ef; color:#805325; font-size:.88rem; }.notice { padding:13px; background:#fff8ef; color:#805325; border-radius:10px; font-size:.9rem; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; padding:20px; }
    @media (max-width:820px) { .workspace { grid-template-columns:1fr; }.matches { grid-template-columns:1fr; }.intro { display:block; } .intro p { margin-bottom:0; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="shuttle">⌁</span>콕끼리</div><p>운영진용 배드민턴 복식 대진표</p></header>
  <main>
    <section class="intro"><div><h1>오늘의 대진을 빠르게 짜세요</h1><p>코트와 참가자만 입력하면, 파트너·상대 중복을 줄여 라운드별 대진을 만듭니다.</p></div></section>
    <div class="workspace">
      <section class="panel" aria-label="대진 조건 입력"><h2>대진 조건</h2>
        <div class="fields"><label>코트 수<input id="courts" type="number" min="1" max="20" value="3" /></label><label>라운드 수<input id="rounds" type="number" min="1" max="20" value="4" /></label></div>
        <label for="names">참가자 이름</label><textarea id="names" placeholder="한 줄에 한 명씩 입력하세요&#10;예)&#10;김민수&#10;이서연&#10;박준호">김민수
이서연
박준호
최유진
정하늘
한지민
윤도현
강수아
임재현
송예린
오현우
배지아</textarea><p class="hint">쉼표로 구분해도 됩니다. 최소 4명이 필요합니다.</p>
        <button id="generate">대진표 만들기</button><button id="copy" class="secondary" type="button">대진표 복사하기</button>
      </section>
      <section class="results" aria-live="polite"><div class="result-head"><h2>생성된 대진표</h2><span class="summary" id="summary">입력 후 생성하세요</span></div><div id="schedule"><div class="empty"><div class="emoji">🏸</div><strong>대진을 기다리고 있어요</strong><br />왼쪽에서 조건을 입력한 뒤 대진표 만들기를 눌러주세요.</div></div></section>
    </div>
  </main><footer>콕끼리 · 대진 결과는 각 기기에서만 처리됩니다.</footer>
  <script>
    const $ = id => document.getElementById(id);
    let lastText = '';
    function key(a,b){ return [a,b].sort().join('|'); }
    function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }
    function pairs(group){ return [[group[0],group[1]],[group[2],group[3]]]; }
    function scoreGroup(g, partners, opponents, plays){
      const [[a,b],[c,d]]=pairs(g); let s=0;
      s += (partners.get(key(a,b))||0)*30 + (partners.get(key(c,d))||0)*30;
      for (const x of [a,b]) for (const y of [c,d]) s += (opponents.get(key(x,y))||0)*8;
      s += g.reduce((v,n)=>v+(plays.get(n)||0),0)*.35; return s;
    }
    function makeRound(names, courtCount, partners, opponents, plays){
      const capacity=Math.min(Math.floor(names.length/4),courtCount); let best;
      for(let trial=0; trial<550; trial++){
        const pool=shuffle(names).sort((a,b)=>(plays.get(a)||0)-(plays.get(b)||0)); const selected=pool.slice(0,capacity*4); const rest=pool.slice(capacity*4);
        let games=[], score=0; for(let i=0;i<selected.length;i+=4){ const g=selected.slice(i,i+4); score+=scoreGroup(g,partners,opponents,plays); games.push(g); }
        if(!best||score<best.score) best={games,rest,score};
      } return best;
    }
    function generate(){
      const names=[...new Set($('names').value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean))]; const courts=+$('courts').value, rounds=+$('rounds').value;
      if(names.length<4||!courts||!rounds){ $('schedule').innerHTML='<p class="notice">참가자 4명 이상과 코트 수, 라운드 수를 확인해주세요.</p>'; return; }
      const partners=new Map(), opponents=new Map(), plays=new Map(names.map(n=>[n,0])); let html='', text=[];
      for(let r=1;r<=rounds;r++){
        const plan=makeRound(names,courts,partners,opponents,plays); let matchHtml='', matchText=[];
        plan.games.forEach((g,i)=>{ const [[a,b],[c,d]]=pairs(g); [[a,b],[c,d]].forEach(([x,y])=>partners.set(key(x,y),(partners.get(key(x,y))||0)+1)); for(const x of [a,b])for(const y of [c,d]) opponents.set(key(x,y),(opponents.get(key(x,y))||0)+1); g.forEach(n=>plays.set(n,(plays.get(n)||0)+1)); matchHtml+=`<article class="match"><div class="court">${i+1}번 코트</div><div class="players">${a} · ${b}<span class="vs">VS</span>${c} · ${d}</div></article>`; matchText.push(`${i+1}번 코트: ${a} · ${b} VS ${c} · ${d}`); });
        const rest=plan.rest.length?`<div class="rest">휴식: ${plan.rest.join(', ')}</div>`:''; html+=`<section class="round"><div class="round-title"><span>${r}R</span> 라운드 ${r}</div><div class="matches">${matchHtml}</div>${rest}</section>`; text.push(`[${r}라운드]\n${matchText.join('\n')}${plan.rest.length?'\n휴식: '+plan.rest.join(', '):''}`);
      }
      $('schedule').innerHTML=html; $('summary').textContent=`참가 ${names.length}명 · ${Math.min(courts,Math.floor(names.length/4))}코트 운영`; lastText='콕끼리 배드민턴 대진표\n\n'+text.join('\n\n');
    }
    $('generate').addEventListener('click',generate);
    $('copy').addEventListener('click',async()=>{ if(!lastText) generate(); try { await navigator.clipboard.writeText(lastText); $('copy').textContent='복사되었습니다'; setTimeout(()=>$('copy').textContent='대진표 복사하기',1500); } catch { alert('대진표를 먼저 생성한 뒤 다시 시도해주세요.'); } });
  </script>
</body>
</html>
